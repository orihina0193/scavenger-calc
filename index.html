<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾い屋パス 計算ツール</title>
<style>
  :root{--bg:#17181c;--card:#23252b;--line:#363944;--tx:#eceef2;--sub:#9aa0ad;--acc:#e0a53a;--ok:#5fcf80;--ng:#e5686a;--vip:#a672e8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans",sans-serif;line-height:1.5;padding:14px;max-width:560px;margin:auto}
  h1{font-size:19px;margin:4px 0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  h2{font-size:15px;margin:0 0 10px;color:var(--acc)}
  label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
  input[type=number]{width:100%;padding:10px;font-size:17px;border-radius:8px;border:1px solid var(--line);background:#14151a;color:var(--tx)}
  .row{display:flex;gap:10px}.row>div{flex:1}
  .res{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .box{border:1px solid var(--line);border-radius:10px;padding:10px;background:#1c1e24}
  .box.vip{border-color:var(--vip)}
  .box h3{margin:0 0 6px;font-size:13px;color:var(--sub)}
  .big{font-size:24px;font-weight:700}
  .small{font-size:12px;color:var(--sub);line-height:1.6}
  .ok{color:var(--ok)}.ng{color:var(--ng)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
  th{color:var(--sub);font-weight:500}
  .note{font-size:12px;color:var(--sub);margin-top:8px}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
  .seg button{flex:1;padding:12px 6px;font-size:14px;border:0;background:#1c1e24;color:var(--sub);font-weight:600}
  .seg button.on{background:var(--acc);color:#1a1a1a}
  .stp{display:flex;align-items:center;justify-content:flex-end;gap:14px}
  .stp .bt{display:flex;gap:6px}
  .stp button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#2d3039;color:var(--tx);font-size:20px;line-height:1;padding:0}
  .stp button{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .stp button:active{background:var(--acc);color:#1a1a1a}
  .stp .v{min-width:34px;text-align:center;font-size:18px;font-weight:700}
  .stp.qty{gap:10px}
  .stp.qty .bt{gap:4px}
  .stp.qty button{width:30px;height:32px;font-size:17px;border-radius:8px}
  .stp.qty .v{min-width:26px;font-size:17px;text-align:right}
  .stp.wide{justify-content:space-between;gap:18px}
  .stp.wide button{width:56px;height:46px}
  .stp.wide .v{min-width:56px;font-size:22px}
  .stm{margin:8px 0;padding:8px 10px;border-radius:10px;background:#2a2417;border:1px solid var(--acc)}
  .stm .t{font-size:12px;color:var(--acc);font-weight:700;margin-bottom:2px}
  .stm .l{display:flex;justify-content:space-between;align-items:baseline}
  .stm .l span{font-size:12px;color:var(--sub)}
  .stm .l b{font-size:20px;color:#ffd27a}
  .stm .n{font-size:11px;color:var(--sub);margin-top:4px}
  .need{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .need b{font-size:18px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 12px}
  .top h1{margin:0}
  .lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0}
  .lang button{padding:7px 10px;font-size:12px;border:0;background:#1c1e24;color:var(--sub);font-weight:600}
  .lang button.on{background:var(--acc);color:#1a1a1a}
</style>
</head>
<body>
<div class="top">
  <h1 data-i18n="title"></h1>
  <div class="lang"><button type="button" data-l="ja">日本語</button><button type="button" data-l="en">English</button></div>
</div>

<div class="card">
  <h2 data-i18n="hStatus"></h2>
  <div class="row">
    <div><label data-i18n="lOwn"></label><input type="number" id="own" value="0" inputmode="numeric"></div>
    <div><label data-i18n="lCur"></label><input type="number" id="cur" value="0" inputmode="numeric"></div>
  </div>
  <div class="row">
    <div><label data-i18n="lDone"></label><input type="number" id="done" value="0" inputmode="numeric"></div>
    <div><label data-i18n="lDays"></label><div class="stp wide" id="days" data-min="1" data-max="3" data-v="2"></div></div>
  </div>
  <div class="row">
    <div><label data-i18n="lPer"></label><input type="number" id="per" value="10" inputmode="numeric"></div>
    <div><label data-i18n="lStam"></label><input type="number" id="stam" value="43" inputmode="numeric"></div>
  </div>
  <div class="note" data-i18n="noteStatus"></div>
</div>

<div class="seg">
  <button id="m1" class="on" data-i18n="m1"></button>
  <button id="m2" data-i18n="m2"></button>
</div>

<div class="card" id="shopCard">
  <h2 data-i18n="hShop"></h2>
  <div id="shop"></div>
  <div class="need"><span data-i18n="needTotal"></span><b id="costT">0</b></div>
  <div class="need"><span data-i18n="needOwn"></span><b id="ownT">0</b></div>
  <div class="need"><span data-i18n="needLack"></span><b id="lackT">0</b></div>
</div>

<div class="card">
  <h2 id="resTitle"></h2>
  <div class="res">
    <div class="box"><h3 data-i18n="boxA"></h3><div id="rA"></div></div>
    <div class="box vip"><h3 data-i18n="boxB"></h3><div id="rB"></div></div>
  </div>
  <div class="note" id="resNote"></div>
</div>

<div class="card">
  <h2 data-i18n="hDaily"></h2>
  <table id="tasks"></table>
  <div class="note" data-i18n="noteDaily"></div>
</div>

<div class="card">
  <h2 data-i18n="hTags"></h2>
  <table>
    <tr><th>pt</th><th data-i18n="thFree"></th><th data-i18n="thVip"></th></tr>
    <tr><td>300</td><td>5</td><td>15</td></tr>
    <tr><td>900</td><td>10</td><td>30</td></tr>
    <tr><td>1300</td><td>15</td><td>45</td></tr>
    <tr><td>1700</td><td>20</td><td>60</td></tr>
    <tr><td data-i18n="total"></td><td>50</td><td>150</td></tr>
  </table>
  <div class="note" data-i18n="noteTags"></div>
</div>

<script>
// ===== 言語（日本語 / English）=====
const D={
ja:{
  title:'拾い屋パス 計算ツール',
  hStatus:'いまの状況',lOwn:'持ち越しの名札',lCur:'現在のポイント',lDone:'今日の討伐済み回数',lDays:'残り日数（今日を含む）',
  lPer:'1討伐あたりの名札',lStam:'1討伐のスタミナ',
  noteStatus:'名札の目安：Lv9以上なら最低10（Lv9=10〜11、Lv10=10〜12、Lv13〜15=10〜15）。多めに見たいときは数字を上げてね。イベントは3日間、いまは今日の残り＋丸1日。',
  m1:'ほしいもの重視',m2:'2000pt完走目標',
  hShop:'ほしいもの（名札ショップ）',needTotal:'必要な名札（合計）',needOwn:'持ち越しの名札',needLack:'足りない名札',
  thItem:'アイテム',thTag:'名札',thLeft:'残',thQty:'個数',
  hRes1:'ほしいもの重視：毎日の討伐回数',hRes2:'2000pt完走目標：毎日の討伐回数',
  boxA:'特権なし',boxB:'特権解放（1600円）',
  resNote1:c=>'ほしいものの名札（'+c+'枚）に届く、一番少ない「毎日の回数」です。デイリー任務のptで増えるパスの名札も数えています。',
  resNote2:'段階ポイントを2000まで完走するのに必要な、一番少ない「毎日の回数」です。特権なしでも完走できるか比べられます。',
  hDaily:'デイリー任務（攻撃回数 → pt）',thAtk:'攻撃回数',
  noteDaily:'全達成で1日1050pt（特権ありは2倍で2100pt）。',
  hTags:'名札の報酬ライン',thFree:'無料側',thVip:'特権側',total:'合計',
  noteTags:'特権側はダイヤ200個×11ラインも付きます（計2200個）。特権を解放すると、すでに過ぎたライン分もまとめて受け取れる前提で計算しています。',
  unreach:'届かない',unreachSub:'毎日150回でも不足',
  noNeed:'討伐なしでOK',noNeedSub:'持ち越しで足りてる',
  perDay:k=>'毎日 '+k+'回',
  stamT:'必要スタミナ',stamDay:'毎日',stamAll:'合計',stamNote:'※狩猟集中のスタミナ軽減は計算外',
  today:(n,k,D)=>'今日はあと <b>'+n+'</b>回'+(D>0?'（以降 毎日'+k+'回）':''),
  totalAtk:n=>'合計 '+n+'回討伐',
  tagLine:(tg,own,drop,pass)=>'名札：'+tg+'枚（持越 '+own+' ＋討伐 '+drop+' ＋パス '+pass+'）',
  ptLine:(p,t)=>'pt：'+p+'（'+t+'/11ライン）'
},
en:{
  title:'Scavenger Pass Calculator',
  hStatus:'Current status',lOwn:'Nameplates carried over',lCur:'Current points',lDone:'Hideout attacks done today',lDays:'Days left (incl. today)',
  lPer:'Nameplates per attack',lStam:'Stamina per attack',
  noteStatus:'Nameplate guide: Lv9+ gives at least 10 (Lv9 = 10–11, Lv10 = 10–12, Lv13–15 = 10–15). Raise the number if you want a more optimistic estimate. The event lasts 3 days; right now it is the rest of today plus one full day.',
  m1:'Shop goal',m2:'Reach 2000 pts',
  hShop:'Wishlist (Supply Shop)',needTotal:'Nameplates needed (total)',needOwn:'Nameplates carried over',needLack:'Nameplates short',
  thItem:'Item',thTag:'Nameplates',thLeft:'Left',thQty:'Qty',
  hRes1:'Shop goal: attacks per day',hRes2:'Reach 2000 pts: attacks per day',
  boxA:'No Privileges',boxB:'Activate Privileges (¥1,600)',
  resNote1:c=>'The fewest attacks per day needed to reach your wishlist ('+c+' nameplates). Pass nameplates earned from Daily Quest points are included.',
  resNote2:'The fewest attacks per day needed to clear every reward tier up to 2000 pts. Compare with and without Privileges.',
  hDaily:'Daily Quest (attacks → pts)',thAtk:'Attacks',
  noteDaily:'Clearing all of them gives 1,050 pts a day (2,100 with Privileges, which doubles it).',
  hTags:'Nameplate rewards by tier',thFree:'Free',thVip:'Privileges',total:'Total',
  noteTags:'The Privileges side also gives 200 diamonds on each of the 11 tiers (2,200 in total). The calculation assumes that activating Privileges also lets you claim the tiers you have already passed.',
  unreach:'Out of reach',unreachSub:'Not enough even at 150 a day',
  noNeed:'No attacks needed',noNeedSub:'Your carried-over nameplates are enough',
  perDay:k=>k+' per day',
  stamT:'Stamina needed',stamDay:'Per day',stamAll:'Total',stamNote:'*Hunt Mastery stamina reduction is not included',
  today:(n,k,D)=>'<b>'+n+'</b> more today'+(D>0?' (then '+k+' per day)':''),
  totalAtk:n=>n+' attacks in total',
  tagLine:(tg,own,drop,pass)=>'Nameplates: '+tg+' ('+own+' carried over + '+drop+' attacks + '+pass+' pass)',
  ptLine:(p,t)=>'Pts: '+p+' ('+t+'/11 tiers)'
}};
let LANG='ja';
try{const s=localStorage.getItem('scav-lang');LANG=(s==='ja'||s==='en')?s:((navigator.language||'ja').toLowerCase().startsWith('ja')?'ja':'en');}catch(e){LANG=(navigator.language||'ja').toLowerCase().startsWith('ja')?'ja':'en';}
const L=()=>D[LANG];

const TASKS=[[1,50],[3,50],[5,50],[10,100],[15,100],[20,100],[25,100],[35,200],[45,300]];
const TIERS=[100,200,300,500,700,900,1100,1300,1500,1700,2000];
const TAG_FREE={300:5,900:10,1300:15,1700:20};
const TAG_VIP={300:15,900:30,1300:45,1700:60};
// [日本語名, English name, 名札, 残り数, 1個あたりの数]
const SHOP=[
  ['ウェポン設計図補給箱Ⅱ','Weapon Design Box II',400,1,'×1'],
  ['ホログラフィー設計図','Holo Design',90,2,'×1'],
  ['異能缶','Amplifier Cell',20,10,'×1'],
  ['ゴールドエッグ','Golden Egg',50,1,'×1'],
  ['選択型改造補給','Modification Choice Box',15,30,'×3'],
  ['選択型プロモート補給（エピック）','Promote Choice Box III',15,30,'×4'],
  ['選択型プロモート補給（エリート）','Promote Choice Box II',15,30,'×15'],
  ['選択型プロモート補給','Promote Choice Box',15,30,'×15'],
  ['機密図','Classified Blueprint',15,10,'×200'],
  ['ナノ炭素繊維管','Carbon Nanotube',15,10,'×20'],
  ['陽子加速器の部品','Proton Accelerator Part',15,10,'×200'],
  ['小型資源補給（安全）','Lesser Resource Box (Safe)',10,10,'×25'],
  ['汎用ブースト（60分）','60-min Omni Speedup',10,10,'×20']
];
const $=id=>document.getElementById(id);
const num=id=>Math.max(0,parseInt($(id).value)||0);
const taskPts=a=>TASKS.reduce((s,[n,p])=>s+(a>=n?p:0),0);
const tiers=p=>TIERS.filter(t=>p>=t).length;
let MODE=1;

// パス報酬の名札。無料側は「現在ptを超えた分」だけ新規、特権側は到達したラインすべて
function passTags(vip,cur,fin){
  let s=0;
  for(const t of TIERS) if(t<=fin){ if(t>cur)s+=TAG_FREE[t]||0; if(vip)s+=TAG_VIP[t]||0; }
  return s;
}
// 「毎日 k 回」攻撃したときの結果。今日は合計 k 回（すでに done 回済み）、残りの丸1日も k 回ずつ
function sim(vip,k,S){
  const m=vip?2:1,T=Math.max(k,S.done),D=Math.max(0,S.days-1);
  const pts=S.cur+(taskPts(T)-taskPts(S.done))*m+D*taskPts(k)*m;
  const atk=(T-S.done)+D*k;
  const drop=atk*S.per,pass=passTags(vip,S.cur,pts);
  return{k,T,D,pts,atk,drop,pass,tg:S.own+drop+pass};
}
// pred を満たす最小の「毎日の回数」
function findK(vip,S,pred){
  for(let k=0;k<=150;k++){const r=sim(vip,k,S);if(pred(r))return r;}
  return null;
}

function buildShop(){
  $('shop').innerHTML='<table><tr><th style="text-align:left" data-i18n="thItem"></th><th data-i18n="thTag"></th><th data-i18n="thLeft"></th><th data-i18n="thQty"></th></tr>'
   +SHOP.map((s,i)=>`<tr><td style="text-align:left"><span class="iname" data-i="${i}"></span><span class="small"> ${s[4]}</span></td><td>${s[2]}</td><td>${s[3]}</td><td><div class="stp qty" data-i="${i}" data-min="0" data-max="${s[3]}" data-v="0"></div></td></tr>`).join('')
   +'</table>';
}
function shopCost(){
  let c=0;
  document.querySelectorAll('.qty').forEach(e=>{
    c+=(+e.dataset.v||0)*SHOP[+e.dataset.i][2];
  });
  return c;
}

function show(id,r,vip,S,cost){
  const el=$(id),T=L();
  if(!r){el.innerHTML='<div class="big ng">'+T.unreach+'</div><div class="small">'+T.unreachSub+'</div>';return;}
  const stDay=r.k*S.stam,stAll=r.atk*S.stam;
  if(MODE===1&&cost-S.own<=0){
    el.innerHTML='<div class="big ok">'+T.noNeed+'</div><div class="small">'+T.noNeedSub+'</div>';return;
  }
  const head='<div class="big ok">'+T.perDay(r.k)+'</div>'
    +'<div class="stm"><div class="t">'+T.stamT+'</div><div class="l"><span>'+T.stamDay+'</span><b>'+stDay.toLocaleString()+'</b></div><div class="l"><span>'+T.stamAll+'</span><b>'+stAll.toLocaleString()+'</b></div><div class="n">'+T.stamNote+'</div></div>';
  const extra='<div class="small">'+T.today(r.T-S.done,r.k,r.D)+'<br>'
    +T.totalAtk(r.atk)+'<br>'
    +T.tagLine(r.tg,S.own,r.drop,r.pass)+'<br>'
    +T.ptLine(r.pts,tiers(r.pts))+'</div>';
  el.innerHTML=head+extra;
}

function calc(){
  const T=L();
  const S={own:num('own'),cur:num('cur'),done:num('done'),days:Math.max(1,+$('days').dataset.v||1),per:num('per'),stam:num('stam')};
  const cost=shopCost(),lack=Math.max(0,cost-S.own);
  $('costT').textContent=cost;$('ownT').textContent=S.own;
  $('lackT').textContent=lack;$('lackT').className=lack>0?'ng':'ok';

  let pred;
  if(MODE===1){
    $('resTitle').textContent=T.hRes1;
    pred=r=>r.tg>=cost;
    $('resNote').textContent=T.resNote1(cost);
  }else{
    $('resTitle').textContent=T.hRes2;
    pred=r=>r.pts>=2000;
    $('resNote').textContent=T.resNote2;
  }
  show('rA',findK(false,S,pred),false,S,cost);
  show('rB',findK(true,S,pred),true,S,cost);
}

// 画面の文言を現在の言語に差し替える
function applyLang(){
  const T=L();
  document.documentElement.lang=LANG;
  document.title=T.title;
  document.querySelectorAll('[data-i18n]').forEach(e=>{e.innerHTML=T[e.dataset.i18n];});
  document.querySelectorAll('.iname').forEach(e=>{e.textContent=SHOP[+e.dataset.i][LANG==='ja'?0:1];});
  $('tasks').innerHTML='<tr><th>'+T.thAtk+'</th>'+TASKS.map(t=>'<th>'+t[0]+'</th>').join('')+'</tr><tr><th>pt</th>'+TASKS.map(t=>'<td>'+t[1]+'</td>').join('')+'</tr>';
  document.querySelectorAll('.lang button').forEach(b=>{b.className=b.dataset.l===LANG?'on':'';});
  calc();
}
function setLang(l){
  LANG=l;
  try{localStorage.setItem('scav-lang',l);}catch(e){}
  applyLang();
}

buildShop();
// ＋／－ ボタンで数字を調整する部品
function drawStp(el){
  el.innerHTML='<span class="v">'+el.dataset.v+'</span><span class="bt"><button type="button" data-d="-1">−</button><button type="button" data-d="1">＋</button></span>';
}
document.querySelectorAll('.stp').forEach(drawStp);
// 長押しで連続して増減（押し続けるほど速くなる）
let holdTimer=null;
function stepOnce(el,d){
  const min=+el.dataset.min,max=+el.dataset.max;
  el.dataset.v=Math.min(max,Math.max(min,(+el.dataset.v||0)+d));
  el.querySelector('.v').textContent=el.dataset.v;
  calc();
}
function stopHold(){if(holdTimer){clearTimeout(holdTimer);holdTimer=null;}}
document.addEventListener('pointerdown',ev=>{
  const b=ev.target.closest&&ev.target.closest('.stp button');if(!b)return;
  ev.preventDefault();
  const el=b.closest('.stp'),d=+b.dataset.d;
  stopHold();
  stepOnce(el,d);
  let n=0;
  const tick=()=>{
    n++;
    stepOnce(el,d*(n>25?5:1));      // 長く押すと5ずつ
    holdTimer=setTimeout(tick,n>25?60:n>8?90:140);
  };
  holdTimer=setTimeout(tick,420);   // 0.4秒押し続けたら連続スタート
});
['pointerup','pointercancel','pointerleave','blur'].forEach(t=>document.addEventListener(t,stopHold,true));
document.addEventListener('contextmenu',ev=>{if(ev.target.closest&&ev.target.closest('.stp'))ev.preventDefault();});
$('m1').onclick=()=>{MODE=1;$('m1').className='on';$('m2').className='';$('shopCard').style.display='';calc();};
$('m2').onclick=()=>{MODE=2;$('m2').className='on';$('m1').className='';$('shopCard').style.display='none';calc();};
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));
document.querySelectorAll('input').forEach(e=>{e.addEventListener('input',calc);e.addEventListener('change',calc)});
applyLang();
</script>
</body>
</html>
